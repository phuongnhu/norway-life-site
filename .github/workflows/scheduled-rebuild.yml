# One-time helper for scheduled posts — safe to delete after the post is live.
name: Scheduled site rebuild
on:
  schedule:
    # Oct 11, 06:15 and 07:30 UTC (08:15 and 09:30 Oslo time) — publishes the
    # future-dated radiation post (dated 08:00 +0200); second run is a backup.
    - cron: "15 6 11 10 *"
    - cron: "30 7 11 10 *"
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub Pages build
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
