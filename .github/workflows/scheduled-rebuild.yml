# One-time helper for a scheduled post — safe to delete after the post is live.
name: Scheduled site rebuild
on:
  schedule:
    # Oct 13, 15:07 and 15:47 UTC (17:07 and 17:47 Oslo time) — publishes the
    # future-dated Malta post (dated 17:00 +0200); second run is a backup.
    - cron: "7 15 13 10 *"
    - cron: "47 15 13 10 *"
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub Pages build
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
